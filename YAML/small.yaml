# machine.yaml
# Example of an object nested inside another object.
# ALICE is a slave of MASTER, and CHARLIE is a slave of ALICE.

name: MASTER
slaves:
  - name: alice
    value: "player_1"
    slaves:
      - name: charlie
        value: "age"
      - name: dave
        value: "score"

  - name: bob
    value: "player_2"
    slaves:
      - name: eve
        value: "age"
