name: SYSTEM
slaves:
  - name: cpu
    value: "cpu0" 

    slaves:
      - name: sysbus 
        slaves:
          - name: decoder_line_count
            value: "3"

          - name: devices 
            value: "./demos/blinky/blinky.o"
            slaves:
              - name: memory # 0x0-0x1fff
                slaves:
                  - name: decoder_line
                    value: "0"
                  - name: address_lines
                    value: "13"

              - name: memory # 0x6000-0x7fff
                slaves:
                  - name: decoder_line
                    value: "3"
                  - name: address_lines
                    value: "13"

              - name: memory # 0xe000-0xffff
                slaves:
                  - name: decoder_line
                    value: "7"
                  - name: address_lines
                    value: "13"
  - name: cpu
    value: "cpu1" 

    slaves:
      - name: sysbus 
        slaves:
          - name: decoder_line_count
            value: "3"

          - name: devices 
            value: "./demos/blinky/blinky.o"
            slaves:
              - name: memory # 0x0-0x1fff
                slaves:
                  - name: decoder_line
                    value: "0"
                  - name: address_lines
                    value: "13"
 
